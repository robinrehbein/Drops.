name: Android release

# Every merge to main creates one signed bundle and publishes it to every
# enabled Play track. Production/open testing remain opt-in until Google grants
# access to those tracks for this app.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      DROPS_SYNC_URL: ${{ vars.SYNC_URL || 'https://drops.robinrehbein.de' }}
      DROPS_REORDER_LINK_TEMPLATE: ${{ vars.REORDER_LINK_TEMPLATE }}
      DROPS_SUPPLY_LINK_TEMPLATE: ${{ vars.SUPPLY_LINK_TEMPLATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Play credentials and signing key
        env:
          PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in PLAY_ACCOUNT KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing production environment secret: $value"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drops-upload.jks"
          chmod 600 "$RUNNER_TEMP/drops-upload.jks"
          {
            echo "DROPS_KEYSTORE_PATH=$RUNNER_TEMP/drops-upload.jks"
            echo "DROPS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DROPS_KEY_ALIAS=$KEY_ALIAS"
            echo "DROPS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set unique version and target tracks
        env:
          ENABLE_OPEN: ${{ vars.PLAY_OPEN_ENABLED }}
          ENABLE_PRODUCTION: ${{ vars.PLAY_PRODUCTION_ENABLED }}
        run: |
          code=$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          echo "DROPS_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "DROPS_VERSION_NAME=0.3.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          tracks=internal,alpha
          if [ "$ENABLE_OPEN" = true ]; then tracks="$tracks,beta"; fi
          if [ "$ENABLE_PRODUCTION" = true ]; then tracks="$tracks,production"; fi
          echo "PLAY_TRACKS=$tracks" >> "$GITHUB_ENV"
          echo "Publishing version code $code to $tracks"

      - name: Test and build signed bundle
        run: ./gradlew :data:jvmTest :server:test :androidApp:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: drops-${{ env.DROPS_VERSION_CODE }}
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.robinrehbein.drops
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          tracks: ${{ env.PLAY_TRACKS }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
